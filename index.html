<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff9500">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Pre-K to grade 5 math practice, one tap at a time.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Math Stars</title>
<style>
  :root{
    --bg:#fff7ec; --bg2:#ffe9f2; --card:#fff; --text:#1c1c1e; --label:#8e8e93;
    --accent:#ff9500; --accent2:#ff7a00;
    --gold:#ffcc00; --silver:#8fa0b3; --bronze:#c87524;   /* light mode needs darker metals */
    --green:#34c759; --red:#ff3b30;
    --pick:#007aff; --pick2:#0a63d8;   /* every answer button, one colour */
    --shadow:0 6px 18px rgba(255,110,60,.18);
    --radius:20px; --pad:12px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14101c; --bg2:#1c1020; --card:#221c2b; --text:#fff; --label:#a8a2b4;
      --pick:#0a84ff; --pick2:#0060d0;
      --silver:#dbe4ee; --bronze:#e08b3c;
      --shadow:0 6px 18px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; color:var(--text);
    background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 100%); background-attachment:fixed;
    font:400 17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:max(var(--pad),env(safe-area-inset-top)) var(--pad) max(var(--pad),env(safe-area-inset-bottom));
    overscroll-behavior:none; user-select:none;
  }
  .wrap{width:100%; max-width:420px; flex:1; display:flex; flex-direction:column; gap:12px}

  /* level row */
  .top{display:flex; align-items:center; gap:4px}
  .top b{
    flex:1; text-align:center; font-weight:700; font-size:15px; letter-spacing:-.2px;
    background:var(--card); border-radius:999px; padding:9px 12px; box-shadow:var(--shadow);
  }
  .chev{background:var(--card); padding:0; width:38px; height:38px; border-radius:999px;
        color:var(--accent); font-size:22px; line-height:1; box-shadow:var(--shadow)}

  /* stars earned this set, hearts left this set */
  .meters{display:flex; align-items:center; gap:10px; height:26px}
  #stars{flex:1; display:flex; gap:3px; font-size:20px}
  #hearts{display:flex; gap:2px; font-size:17px}
  .meters i{font-style:normal; color:var(--label); opacity:.16; transition:transform .2s, opacity .3s}
  /* one tap gold, two silver, three bronze */
  #stars i.g1{color:var(--gold); opacity:1; text-shadow:0 2px 8px rgba(255,204,0,.6)}
  #stars i.g2{color:var(--silver); opacity:1; text-shadow:0 1px 5px rgba(160,180,200,.7)}
  #stars i.g3{color:var(--bronze); opacity:1; text-shadow:0 1px 5px rgba(224,139,60,.5)}
  #hearts i.on{color:var(--red); opacity:1}
  .meters i.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(.4) rotate(-25deg)} 60%{transform:scale(1.45) rotate(8deg)} 100%{transform:scale(1)}}

  /* question card */
  #q{
    flex:1; min-height:130px; display:flex; align-items:center; justify-content:center;
    border-radius:26px; color:#fff; text-align:center;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 10px 26px rgba(255,140,0,.35);
    font-weight:700; font-size:clamp(40px,13vw,64px); letter-spacing:-1px;
    font-variant-numeric:tabular-nums; transition:background .2s, transform .2s;
    white-space:pre-line;                 /* the multi-line cards below */
  }
  #q.right{background:linear-gradient(135deg,#34c759,#00c7be); transform:scale(1.03)}
  #q.silver{background:linear-gradient(135deg,#9aa7b4,#7d8a99); transform:scale(1.02)}
  #q.bronze{background:linear-gradient(135deg,#d1813f,#a35f27)}
  #q.easier{background:linear-gradient(135deg,#5ac8fa,#007aff); font-size:clamp(26px,8vw,38px)}
  #q.over{background:linear-gradient(135deg,#ff3b30,#c1121f); font-size:clamp(26px,8vw,38px); cursor:pointer}
  #q.party{background:linear-gradient(135deg,#ffcc00,var(--accent)); font-size:clamp(30px,9vw,44px)}

  /* answers */
  .grid{flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:12px}
  button{font:inherit; border:0; cursor:pointer; color:var(--text); background:var(--card)}
  .grid button{
    padding:8px; min-height:78px; border-radius:var(--radius); color:#fff;
    background:linear-gradient(150deg,var(--pick),var(--pick2));
    font-size:36px; font-weight:700; font-variant-numeric:tabular-nums;
    box-shadow:0 6px 16px rgba(0,110,255,.3);
    transition:transform .12s, filter .15s, opacity .2s;
  }
  .grid button:active{transform:scale(.94)}
  .grid button.wrong{filter:grayscale(1) brightness(.75); opacity:.4; animation:shake .35s}
  .grid button.off{filter:grayscale(1) brightness(.85); opacity:.25}
  .grid button.right{animation:cheer .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
  @keyframes cheer{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="chev" id="prev" aria-label="Easier">‹</button>
    <b id="level">—</b>
    <button class="chev" id="mute" aria-label="Sound">🔊</button>
    <button class="chev" id="next" aria-label="Harder">›</button>
  </div>
  <div class="meters">
    <div id="stars"></div>
    <div id="hearts"></div>
  </div>
  <div id="q">—</div>
  <div class="grid" id="choices">
    <button></button><button></button><button></button><button></button>
  </div>
</div>
<script type="module" src="./src/game.mjs"></script>
</body>
</html>
