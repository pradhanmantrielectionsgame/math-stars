<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff9500">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Pre-K to grade 5 math practice, one tap at a time.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Math Stars</title>
<style>
  /* iOS-flavoured tokens. Light values on :root, dark overridden below. */
  :root{
    --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --label:#8e8e93;
    --accent:#ff9500; --line:rgba(60,60,67,.12);
    --radius:14px; --pad:12px;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#000; --card:#1c1c1e; --text:#fff; --label:#98989f; --line:rgba(84,84,88,.4); }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:400 17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:max(var(--pad),env(safe-area-inset-top)) var(--pad) max(var(--pad),env(safe-area-inset-bottom));
    overscroll-behavior:none; user-select:none;
  }
  .wrap{width:100%; max-width:420px; display:flex; flex-direction:column; gap:10px}
  .row{display:flex; gap:8px; align-items:center}
  h1{font-size:26px; font-weight:700; letter-spacing:-.5px; margin:0; flex:1}
  .card{background:var(--card); border-radius:var(--radius); padding:6px 12px; min-width:78px; text-align:center}
  .card b{display:block; font-size:20px; font-weight:700; font-variant-numeric:tabular-nums}
  .card small{color:var(--label); font-size:10px; text-transform:uppercase; letter-spacing:.6px}
  button{font:inherit; color:var(--text); background:var(--card); border:0;
         border-radius:var(--radius); padding:12px 16px; font-weight:600; cursor:pointer}
  button:active{opacity:.6}
  #board{position:relative; width:100%; aspect-ratio:1; background:var(--card);
         border-radius:16px; display:flex; align-items:center; justify-content:center;
         color:var(--label); text-align:center; padding:24px}
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <h1>Math Stars</h1>
    <div class="card"><small>Score</small><b id="score">0</b></div>
    <div class="card"><small>Best</small><b id="best">0</b></div>
  </div>
  <div id="board">Swipe or tap here</div>
  <div class="row">
    <button id="new" style="flex:1">New Game</button>
    <button id="share">Share</button>
  </div>
</div>
<script type="module" src="./src/game.mjs"></script>
</body>
</html>
