<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff9500">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Pre-K to grade 5 math practice, one tap at a time.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Math Stars</title>
<style>
  :root{
    --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --label:#8e8e93;
    --accent:#ff9500; --green:#34c759; --red:#ff3b30; --line:rgba(60,60,67,.12);
    --radius:14px; --pad:12px;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#000; --card:#1c1c1e; --text:#fff; --label:#98989f; --line:rgba(84,84,88,.4); }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:400 17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:max(var(--pad),env(safe-area-inset-top)) var(--pad) max(var(--pad),env(safe-area-inset-bottom));
    overscroll-behavior:none; user-select:none;
  }
  .wrap{width:100%; max-width:420px; flex:1; display:flex; flex-direction:column; gap:14px}
  .top{display:flex; align-items:center; gap:6px; color:var(--label); font-size:14px}
  .top b{flex:1; text-align:center; font-weight:600; color:var(--text); font-size:15px}
  .chev{background:none; padding:6px 10px; color:var(--label); font-size:20px; line-height:1}
  #stars{font-size:24px; letter-spacing:4px; text-align:center; height:30px}
  #q{
    flex:1; display:flex; align-items:center; justify-content:center;
    background:var(--card); border-radius:22px;
    font-weight:600; font-size:clamp(40px,13vw,64px); letter-spacing:-1px;
    font-variant-numeric:tabular-nums; transition:background .15s;
  }
  #q.right{background:var(--green); color:#fff}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  button{
    font:inherit; color:var(--text); background:var(--card); border:0;
    border-radius:var(--radius); cursor:pointer;
  }
  .grid button{
    padding:22px 8px; font-size:34px; font-weight:600; font-variant-numeric:tabular-nums;
    transition:background .15s, color .15s, transform .1s;
  }
  .grid button:active{transform:scale(.96)}
  .grid button.wrong{background:var(--red); color:#fff; opacity:.45}
  .grid button.right{background:var(--green); color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="chev" id="prev" aria-label="Easier">‹</button>
    <b id="level">—</b>
    <button class="chev" id="mute" aria-label="Sound">🔊</button>
    <button class="chev" id="next" aria-label="Harder">›</button>
  </div>
  <div id="stars"></div>
  <div id="q">—</div>
  <div class="grid" id="choices">
    <button></button><button></button><button></button><button></button>
  </div>
</div>
<script type="module" src="./src/game.mjs"></script>
</body>
</html>
